name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
        # --ignore-scripts sẽ chặn mọi post-install, giúp pnpm cài đặt thành công 100% mà không văng lỗi bảo mật
        run: pnpm install --frozen-lockfile --ignore-scripts

  - name: Generate Prisma Client
        # Vì đã chặn script ở trên, ta cần tự chạy lệnh generate của prisma
        run: pnpm exec prisma generate

    - name: Build Frontend
      run: pnpm --filter client run build
